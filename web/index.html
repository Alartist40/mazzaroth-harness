<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Mazzaroth — Multilingual Celestial Cognitive Galaxy</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
    
    .hud-overlay {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      width: 380px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    h1 { font-size: 1.15rem; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; letter-spacing: 0.5px; }
    .stats-bar { font-size: 0.78rem; color: #94a3b8; margin-bottom: 14px; display: flex; gap: 12px; }
    .stat-pill { background: rgba(30, 41, 59, 0.8); padding: 3px 8px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.05); }
    
    .input-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.72rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; font-weight: 600; }
    input, textarea, select {
      width: 100%;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #fff;
      padding: 8px 12px;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.2s;
    }
    input:focus, textarea:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
    
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1;
      background: linear-gradient(135deg, #0284c7, #6366f1);
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 9px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button.secondary { background: rgba(51, 65, 85, 0.8); border: 1px solid rgba(255,255,255,0.1); }

    .details-card {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 10;
      width: 360px;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: none;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .tier-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .badge-celestial { background: #eab308; color: #000; }
    .badge-semantic { background: #0284c7; color: #fff; }
    .badge-episodic { background: #9333ea; color: #fff; }
    .badge-working { background: #f97316; color: #fff; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <h1>🌌 MAZZAROTH GALAXY</h1>
    <div class="stats-bar">
      <span class="stat-pill" id="stat-stars">✨ 0 Stars</span>
      <span class="stat-pill" id="stat-sectors">🪐 0 Superclusters</span>
      <span class="stat-pill" id="stat-links">🔗 0 Constellations</span>
    </div>

    <div class="input-group">
      <label>Search & Recall Galaxy</label>
      <input type="text" id="search-query" placeholder="e.g. Genesis, Light, Greek, Hebrew..." onkeydown="if(event.key==='Enter') searchGalaxy()">
    </div>
    <div class="btn-row">
      <button onclick="searchGalaxy()">🔍 Recall Concept</button>
      <button class="secondary" onclick="toggleAutoRotate()">⟳ Toggle Orbit</button>
    </div>

    <div style="margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">
      <div class="input-group">
        <label>Ignite New Memory Concept</label>
        <input type="text" id="mem-label" placeholder="Concept / Entity Name">
      </div>
      <div class="input-group">
        <textarea id="mem-content" rows="2" placeholder="Full memory content..."></textarea>
      </div>
      <div class="input-group">
        <select id="mem-tier">
          <option value="semantic">Semantic (Fact / Knowledge)</option>
          <option value="episodic">Episodic (Event / Log)</option>
          <option value="working">Working (Sensory / Perception)</option>
          <option value="celestial">Celestial (Core Anchor)</option>
        </select>
      </div>
      <button onclick="formMemory()">✨ Form Celestial Star</button>
    </div>
  </div>

  <div class="details-card" id="details-card">
    <span class="tier-badge badge-semantic" id="card-tier">SEMANTIC</span>
    <h2 id="card-title" style="font-size: 1.15rem; margin-bottom: 6px; color: #fff;">Concept</h2>
    <p id="card-content" style="font-size: 0.85rem; color: #cbd5e1; line-height: 1.45; margin-bottom: 12px; max-height: 160px; overflow-y: auto;"></p>
    <div style="font-size: 0.75rem; color: #94a3b8; display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px;">
      <span id="card-mass">Mass: 0.85</span>
      <span id="card-luminosity">Luminosity: 0.90</span>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let starMeshes = [];
    let lineSegments;
    const container = document.getElementById('canvas-container');

    function init() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020617, 0.0006);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 5000);
      camera.position.set(0, 300, 700);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.35;

      // Cosmic Lights
      scene.add(new THREE.AmbientLight(0x1e293b, 1.8));
      const coreLight = new THREE.PointLight(0xfacc15, 3.5, 1200);
      coreLight.position.set(0, 0, 0);
      scene.add(coreLight);

      // Starfield Particle Dust
      createBackgroundDust();

      // Raycasting for star selection
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('click', (event) => {
        if (event.target.closest('.hud-overlay') || event.target.closest('.details-card')) return;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(starMeshes);

        if (intersects.length > 0) {
          const body = intersects[0].object.userData;
          showDetails(body);
        }
      });

      // Poll galaxy state
      fetchGalaxy();
      setInterval(fetchGalaxy, 3000);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function createBackgroundDust() {
      const geo = new THREE.BufferGeometry();
      const count = 5000;
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count * 3; i++) {
        pos[i] = (Math.random() - 0.5) * 3000;
      }
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      const mat = new THREE.PointsMaterial({ color: 0x475569, size: 2.5, transparent: true, opacity: 0.6 });
      scene.add(new THREE.Points(geo, mat));
    }

    async function fetchGalaxy() {
      try {
        const res = await fetch('/api/memory/celestial');
        if (!res.ok) return;
        const data = await res.json();
        updateGalaxy(data);
      } catch (e) {}
    }

    function updateGalaxy(galaxy) {
      document.getElementById('stat-stars').textContent = `✨ ${galaxy.bodies.length} Stars`;
      document.getElementById('stat-sectors').textContent = `🪐 ${galaxy.bodies.filter(b => b.tier === 'celestial').length} Sectors`;
      document.getElementById('stat-links').textContent = `🔗 ${galaxy.lines.length} Links`;

      // Clear old meshes
      starMeshes.forEach(m => scene.remove(m));
      starMeshes = [];
      if (lineSegments) scene.remove(lineSegments);

      const sphereGeo = new THREE.SphereGeometry(1, 14, 14);

      // Render Stars with Glowing Coronas
      galaxy.bodies.forEach(body => {
        const color = new THREE.Color(`rgb(${body.color.r}, ${body.color.g}, ${body.color.b})`);
        const scale = Math.max(body.radius * 0.9, 3.5);

        const mat = new THREE.MeshStandardMaterial({
          color: color,
          emissive: color,
          emissiveIntensity: 0.7,
          roughness: 0.15
        });

        const mesh = new THREE.Mesh(sphereGeo, mat);
        mesh.scale.set(scale, scale, scale);
        mesh.position.set(body.x, body.y, body.z);
        mesh.userData = body;
        scene.add(mesh);
        starMeshes.push(mesh);
      });

      // Render Constellation Link Lines
      const linePositions = [];
      galaxy.lines.forEach(l => {
        const s = galaxy.bodies.find(b => b.id === l.source_id);
        const t = galaxy.bodies.find(b => b.id === l.target_id);
        if (s && t) {
          linePositions.push(s.x, s.y, s.z);
          linePositions.push(t.x, t.y, t.z);
        }
      });

      if (linePositions.length > 0) {
        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.3 });
        lineSegments = new THREE.LineSegments(lineGeo, lineMat);
        scene.add(lineSegments);
      }
    }

    function showDetails(body) {
      const card = document.getElementById('details-card');
      const badge = document.getElementById('card-tier');
      badge.textContent = body.tier.toUpperCase();
      badge.className = `tier-badge badge-${body.tier}`;

      document.getElementById('card-title').textContent = body.label;
      document.getElementById('card-content').textContent = `Star ID: ${body.id}\nOrbit Radius: ${body.orbit_radius.toFixed(1)} AU\nSpectral Class: RGB(${body.color.r}, ${body.color.g}, ${body.color.b})`;
      document.getElementById('card-mass').textContent = `Mass / Strength: ${body.mass.toFixed(2)}`;
      document.getElementById('card-luminosity').textContent = `Activation: ${body.luminosity.toFixed(2)}`;
      card.style.display = 'block';

      // Smooth camera pan towards star
      controls.target.set(body.x, body.y, body.z);
    }

    async function searchGalaxy() {
      const query = document.getElementById('search-query').value.trim();
      if (!query) return;

      const res = await fetch(`/api/memory/recall?q=${encodeURIComponent(query)}&limit=5`);
      if (res.ok) {
        const results = await res.json();
        if (results.length > 0) {
          const first = results[0];
          const mesh = starMeshes.find(m => m.userData.id === first.id);
          if (mesh) {
            showDetails(mesh.userData);
            controls.target.set(mesh.position.x, mesh.position.y, mesh.position.z);
          }
        }
      }
    }

    async function formMemory() {
      const label = document.getElementById('mem-label').value.trim();
      const content = document.getElementById('mem-content').value.trim();
      const tier = document.getElementById('mem-tier').value;
      if (!label) return;

      await fetch('/api/memory/ingest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label, content, tier, tags: ['user_ignited'] })
      });

      document.getElementById('mem-label').value = '';
      document.getElementById('mem-content').value = '';
      fetchGalaxy();
    }

    function toggleAutoRotate() {
      controls.autoRotate = !controls.autoRotate;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
