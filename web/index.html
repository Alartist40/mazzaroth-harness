<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Mazzaroth — Celestial Cognitive Galaxy</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #05020c;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    .hud-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      width: 380px;
      background: rgba(13, 6, 28, 0.75);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(147, 51, 234, 0.15);
    }
    h1 {
      font-size: 1.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fde047, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      letter-spacing: 0.8px;
    }
    .subtitle { font-size: 0.75rem; color: #a855f7; margin-bottom: 14px; font-weight: 500; }
    .stats-bar { font-size: 0.76rem; color: #cbd5e1; margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    .stat-pill { background: rgba(30, 14, 58, 0.8); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(168, 85, 247, 0.2); }

    .input-group { margin-bottom: 12px; }
    label { display: block; font-size: 0.7rem; text-transform: uppercase; color: #cbd5e1; margin-bottom: 4px; font-weight: 700; letter-spacing: 0.5px; }
    input, textarea, select {
      width: 100%;
      background: rgba(23, 10, 48, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 10px;
      color: #fff;
      padding: 9px 14px;
      font-size: 0.85rem;
      outline: none;
      transition: all 0.25s;
    }
    input:focus, textarea:focus { border-color: #c084fc; box-shadow: 0 0 15px rgba(192, 132, 252, 0.3); }

    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1;
      background: linear-gradient(135deg, #9333ea, #6366f1, #38bdf8);
      border: none;
      border-radius: 10px;
      color: #fff;
      padding: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(147, 51, 234, 0.4);
    }
    button:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(147, 51, 234, 0.6); }
    button.secondary { background: rgba(30, 14, 58, 0.8); border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: none; }

    .details-card {
      position: absolute;
      bottom: 28px;
      right: 28px;
      z-index: 10;
      width: 380px;
      background: rgba(13, 6, 28, 0.85);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(250, 204, 21, 0.4);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 35px rgba(250, 204, 21, 0.2);
      display: none;
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.92) translateY(15px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .tier-badge {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }
    .badge-celestial { background: linear-gradient(135deg, #facc15, #ea580c); color: #000; box-shadow: 0 0 12px rgba(250, 204, 21, 0.6); }
    .badge-semantic { background: linear-gradient(135deg, #38bdf8, #6366f1); color: #fff; box-shadow: 0 0 12px rgba(56, 189, 248, 0.5); }
    .badge-episodic { background: linear-gradient(135deg, #c084fc, #9333ea); color: #fff; box-shadow: 0 0 12px rgba(192, 132, 252, 0.5); }
    .badge-working { background: linear-gradient(135deg, #fb923c, #f43f5e); color: #fff; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-overlay">
    <h1>🌌 MAZZAROTH GALAXY</h1>
    <div class="subtitle">Multilingual Celestial Cognitive Memory Matrix</div>

    <div class="stats-bar">
      <span class="stat-pill" id="stat-stars">✨ 0 Celestial Stars</span>
      <span class="stat-pill" id="stat-sectors">🪐 0 Languages</span>
      <span class="stat-pill" id="stat-links">🔗 0 Constellations</span>
    </div>

    <div class="input-group">
      <label>Search & Navigate Galaxy</label>
      <input type="text" id="search-query" placeholder="e.g. Genesis, Light, Greek, Hebrew, John..." onkeydown="if(event.key==='Enter') searchGalaxy()">
    </div>
    <div class="btn-row">
      <button onclick="searchGalaxy()">🔍 Warp to Star</button>
      <button class="secondary" onclick="toggleAutoRotate()">⟳ Toggle Orbit</button>
    </div>

    <div style="margin-top: 14px; border-top: 1px solid rgba(168, 85, 247, 0.2); padding-top: 12px;">
      <div class="input-group">
        <label>Ignite New Memory Concept</label>
        <input type="text" id="mem-label" placeholder="Concept / Entity Name">
      </div>
      <div class="input-group">
        <textarea id="mem-content" rows="2" placeholder="Full memory content..."></textarea>
      </div>
      <button onclick="formMemory()">✨ Form Celestial Memory</button>
    </div>
  </div>

  <div class="details-card" id="details-card">
    <span class="tier-badge badge-celestial" id="card-tier">CELESTIAL</span>
    <h2 id="card-title" style="font-size: 1.25rem; margin-bottom: 8px; color: #fff; font-weight: 800;">Star Name</h2>
    <p id="card-content" style="font-size: 0.88rem; color: #e2e8f0; line-height: 1.5; margin-bottom: 14px; max-height: 180px; overflow-y: auto;"></p>
    <div style="font-size: 0.78rem; color: #cbd5e1; display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px;">
      <span id="card-mass">Mass: 1.00</span>
      <span id="card-luminosity">Luminosity: 1.00</span>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let starMeshes = [];
    let coreSunMesh, coreCoronaMesh;
    let spiralParticleSystem;
    let lineSegments;
    const container = document.getElementById('canvas-container');

    function init() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x05020c, 0.0004);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 8000);
      camera.position.set(0, 450, 850);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.2;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.25;

      // Lights
      scene.add(new THREE.AmbientLight(0x2e1065, 2.0));
      const coreLight = new THREE.PointLight(0xfef08a, 4.5, 2500);
      coreLight.position.set(0, 0, 0);
      scene.add(coreLight);

      const purpleLight = new THREE.PointLight(0xa855f7, 3.0, 3000);
      purpleLight.position.set(0, 200, 0);
      scene.add(purpleLight);

      // Build Supermassive Galactic Spiral & Central Sun
      createGalacticSpiralDust();
      createSupermassiveCoreSun();

      // Raycasting for star selection
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('click', (event) => {
        if (event.target.closest('.hud-overlay') || event.target.closest('.details-card')) return;
        mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(starMeshes);

        if (intersects.length > 0) {
          const body = intersects[0].object.userData;
          showDetails(body);
        }
      });

      // Poll galaxy state
      fetchGalaxy();
      setInterval(fetchGalaxy, 3000);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // Creates the glowing purple/violet/gold swirling logarithmic spiral arms
    function createGalacticSpiralDust() {
      const particleCount = 20000;
      const geo = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const numArms = 4;
      const coreColor = new THREE.Color(0xfef08a); // Gold center
      const midColor = new THREE.Color(0xc084fc);  // Purple mid
      const edgeColor = new THREE.Color(0x38bdf8); // Cyan rim

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const armIndex = i % numArms;
        const armAngle = (armIndex / numArms) * Math.PI * 2;
        const radius = Math.pow(Math.random(), 1.5) * 800 + 30;
        const spinAngle = radius * 0.0035;

        // Spread / dispersion around the spiral arm
        const randomX = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3) * radius;
        const randomY = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.15) * radius;
        const randomZ = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.3) * radius;

        positions[i3] = Math.cos(armAngle + spinAngle) * radius + randomX;
        positions[i3 + 1] = randomY + Math.sin(radius * 0.01) * 15;
        positions[i3 + 2] = Math.sin(armAngle + spinAngle) * radius + randomZ;

        // Color interpolation based on radius
        let mixedColor;
        if (radius < 250) {
          mixedColor = coreColor.clone().lerp(midColor, radius / 250);
        } else {
          mixedColor = midColor.clone().lerp(edgeColor, (radius - 250) / 550);
        }

        colors[i3] = mixedColor.r;
        colors[i3 + 1] = mixedColor.g;
        colors[i3 + 2] = mixedColor.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({
        size: 3.5,
        vertexColors: true,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      spiralParticleSystem = new THREE.Points(geo, mat);
      scene.add(spiralParticleSystem);
    }

    function createSupermassiveCoreSun() {
      // 1. Core Glowing Sun
      const sunGeo = new THREE.SphereGeometry(18, 32, 32);
      const sunMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      coreSunMesh = new THREE.Mesh(sunGeo, sunMat);
      scene.add(coreSunMesh);

      // 2. Volumetric Corona Halo
      const coronaGeo = new THREE.SphereGeometry(32, 32, 32);
      const coronaMat = new THREE.MeshBasicMaterial({
        color: 0xfde047,
        transparent: true,
        opacity: 0.45,
        blending: THREE.AdditiveBlending,
      });
      coreCoronaMesh = new THREE.Mesh(coronaGeo, coronaMat);
      scene.add(coreCoronaMesh);

      // 3. Outer Purple Accretion Ring
      const ringGeo = new THREE.RingGeometry(35, 90, 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0xa855f7,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.35,
        blending: THREE.AdditiveBlending,
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.rotation.x = Math.PI / 2;
      scene.add(ringMesh);
    }

    async function fetchGalaxy() {
      try {
        const res = await fetch('/api/memory/celestial');
        if (!res.ok) return;
        const data = await res.json();
        updateGalaxy(data);
      } catch (e) {}
    }

    function updateGalaxy(galaxy) {
      document.getElementById('stat-stars').textContent = `✨ ${galaxy.bodies.length} Celestial Stars`;
      document.getElementById('stat-sectors').textContent = `🪐 ${galaxy.bodies.filter(b => b.id.includes(':lang:')).length} Languages`;
      document.getElementById('stat-links').textContent = `🔗 ${galaxy.lines.length} Constellations`;

      // Clear old meshes
      starMeshes.forEach(m => scene.remove(m));
      starMeshes = [];
      if (lineSegments) scene.remove(lineSegments);

      const sphereGeo = new THREE.SphereGeometry(1, 16, 16);

      galaxy.bodies.forEach(body => {
        let color, scale;

        if (body.id === 'celestial:core:database') {
          color = new THREE.Color(0xfef08a);
          scale = 20.0;
        } else if (body.id.startsWith('celestial:lang:')) {
          // Language Supercluster Planet Star
          color = new THREE.Color(0xfde047); // Golden planet
          scale = 10.0;
        } else if (body.id.startsWith('semantic:version:')) {
          // Version Moon Star
          color = new THREE.Color(0x38bdf8); // Cyan star
          scale = 6.0;
        } else {
          // Verse / Chapter Star
          color = new THREE.Color(0xc084fc); // Violet star
          scale = 3.8;
        }

        const mat = new THREE.MeshStandardMaterial({
          color: color,
          emissive: color,
          emissiveIntensity: 0.85,
          roughness: 0.1,
        });

        const mesh = new THREE.Mesh(sphereGeo, mat);
        mesh.scale.set(scale, scale, scale);
        mesh.position.set(body.x, body.y, body.z);
        mesh.userData = body;
        scene.add(mesh);
        starMeshes.push(mesh);
      });

      // Render Glowing Constellation Rays & Filaments
      const linePositions = [];
      galaxy.lines.forEach(l => {
        const s = galaxy.bodies.find(b => b.id === l.source_id);
        const t = galaxy.bodies.find(b => b.id === l.target_id);
        if (s && t) {
          linePositions.push(s.x, s.y, s.z);
          linePositions.push(t.x, t.y, t.z);
        }
      });

      if (linePositions.length > 0) {
        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
        const lineMat = new THREE.LineBasicMaterial({
          color: 0xa855f7,
          transparent: true,
          opacity: 0.38,
          blending: THREE.AdditiveBlending,
        });
        lineSegments = new THREE.LineSegments(lineGeo, lineMat);
        scene.add(lineSegments);
      }
    }

    function showDetails(body) {
      const card = document.getElementById('details-card');
      const badge = document.getElementById('card-tier');
      badge.textContent = body.tier.toUpperCase();
      badge.className = `tier-badge badge-${body.tier}`;

      document.getElementById('card-title').textContent = body.label;
      document.getElementById('card-content').textContent = `ID: ${body.id}\nOrbit Radius: ${body.orbit_radius.toFixed(1)} AU\nSpectral Class: RGB(${body.color.r}, ${body.color.g}, ${body.color.b})`;
      document.getElementById('card-mass').textContent = `Mass / Retention: ${body.mass.toFixed(2)}`;
      document.getElementById('card-luminosity').textContent = `Activation: ${body.luminosity.toFixed(2)}`;
      card.style.display = 'block';

      // Smooth camera pan towards selected star
      controls.target.set(body.x, body.y, body.z);
    }

    async function searchGalaxy() {
      const query = document.getElementById('search-query').value.trim();
      if (!query) return;

      const res = await fetch(`/api/memory/recall?q=${encodeURIComponent(query)}&limit=5`);
      if (res.ok) {
        const results = await res.json();
        if (results.length > 0) {
          const first = results[0];
          const mesh = starMeshes.find(m => m.userData.id === first.id);
          if (mesh) {
            showDetails(mesh.userData);
            controls.target.set(mesh.position.x, mesh.position.y, mesh.position.z);
          }
        }
      }
    }

    async function formMemory() {
      const label = document.getElementById('mem-label').value.trim();
      const content = document.getElementById('mem-content').value.trim();
      if (!label) return;

      await fetch('/api/memory/ingest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label, content, tier: 'semantic', tags: ['user_memory'] })
      });

      document.getElementById('mem-label').value = '';
      document.getElementById('mem-content').value = '';
      fetchGalaxy();
    }

    function toggleAutoRotate() {
      controls.autoRotate = !controls.autoRotate;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      // Rotate spiral dust particles slowly for fluid cosmic motion
      if (spiralParticleSystem) {
        spiralParticleSystem.rotation.y += 0.0008;
      }
      if (coreCoronaMesh) {
        coreCoronaMesh.rotation.y -= 0.001;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
