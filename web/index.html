<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌌 Mazzaroth — Second Brain Cognitive Galaxy</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #04010a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }
    #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }

    /* Top HUD Navigation Bar */
    .top-bar {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(14, 6, 32, 0.85);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(168, 85, 247, 0.3);
      border-radius: 40px;
      padding: 8px 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.7), 0 0 25px rgba(168, 85, 247, 0.15);
    }
    .top-btn {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .top-btn:hover { color: #fde047; background: rgba(168, 85, 247, 0.15); }
    .top-btn.active { color: #38bdf8; background: rgba(56, 189, 248, 0.15); font-weight: 700; }
    .top-sep { color: #64748b; font-size: 0.8rem; }

    /* Left Sidebar */
    .hud-overlay {
      position: absolute;
      top: 24px;
      left: 24px;
      z-index: 10;
      width: 380px;
      background: rgba(14, 6, 32, 0.82);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 40px rgba(147, 51, 234, 0.15);
      max-height: calc(100vh - 48px);
      display: flex;
      flex-direction: column;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 900;
      background: linear-gradient(135deg, #fde047, #c084fc, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .subtitle { font-size: 0.75rem; color: #c084fc; margin-bottom: 14px; font-weight: 500; }
    .stats-bar { font-size: 0.75rem; color: #cbd5e1; margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .stat-pill { background: rgba(30, 14, 58, 0.9); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(168, 85, 247, 0.25); }

    input, textarea, select {
      width: 100%;
      background: rgba(23, 10, 48, 0.9);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 12px;
      color: #fff;
      padding: 10px 14px;
      font-size: 0.85rem;
      outline: none;
      margin-bottom: 10px;
      transition: all 0.25s;
    }
    input:focus, textarea:focus { border-color: #c084fc; box-shadow: 0 0 15px rgba(192, 132, 252, 0.3); }

    .btn-row { display: flex; gap: 8px; margin-bottom: 12px; }
    button.action-btn {
      flex: 1;
      background: linear-gradient(135deg, #9333ea, #6366f1, #38bdf8);
      border: none;
      border-radius: 10px;
      color: #fff;
      padding: 9px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(147, 51, 234, 0.3);
    }
    button.action-btn:hover { opacity: 0.95; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(147, 51, 234, 0.5); }
    button.action-btn.secondary { background: rgba(30, 14, 58, 0.85); border: 1px solid rgba(168, 85, 247, 0.3); box-shadow: none; }

    /* Topic / Language Clusters */
    .cluster-scroll {
      flex: 1;
      overflow-y: auto;
      margin-top: 6px;
      border-top: 1px solid rgba(168, 85, 247, 0.2);
      padding-top: 10px;
    }
    .cluster-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      color: #cbd5e1;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 4px;
    }
    .cluster-item:hover {
      background: rgba(147, 51, 234, 0.25);
      color: #fde047;
      transform: translateX(4px);
    }

    /* Right Memory Note & Knowledge Inspector */
    .note-inspector {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
      width: 460px;
      max-height: calc(100vh - 48px);
      background: rgba(14, 6, 32, 0.88);
      backdrop-filter: blur(30px);
      border: 1px solid rgba(250, 204, 21, 0.4);
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 25px 65px rgba(0, 0, 0, 0.85), 0 0 45px rgba(250, 204, 21, 0.15);
      display: none;
      overflow-y: auto;
      animation: slideIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideIn { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }

    .note-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-core { background: linear-gradient(135deg, #facc15, #ea580c); color: #000; box-shadow: 0 0 15px rgba(250, 204, 21, 0.5); }
    .badge-lang { background: linear-gradient(135deg, #38bdf8, #6366f1); color: #000; }
    .badge-version { background: linear-gradient(135deg, #c084fc, #9333ea); color: #fff; }
    .badge-book { background: linear-gradient(135deg, #fb923c, #f43f5e); color: #fff; }

    .note-title { font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 6px; line-height: 1.3; }
    .note-meta { font-size: 0.78rem; color: #94a3b8; margin-bottom: 14px; display: flex; gap: 12px; }

    .note-content {
      background: rgba(23, 10, 48, 0.95);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 14px;
      padding: 16px;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #f1f5f9;
      margin-bottom: 16px;
      white-space: pre-wrap;
      max-height: 320px;
      overflow-y: auto;
    }

    .tags-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .tag-pill { background: rgba(147, 51, 234, 0.2); border: 1px solid rgba(168, 85, 247, 0.3); color: #c084fc; padding: 2px 8px; border-radius: 6px; font-size: 0.72rem; }

    .constellation-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }
    .constellation-card {
      background: rgba(30, 14, 58, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.25);
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .constellation-card:hover {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
      transform: translateY(-2px);
    }
    .constellation-title { font-size: 0.82rem; font-weight: 700; color: #f8fafc; margin-bottom: 2px; }
    .constellation-sub { font-size: 0.7rem; color: #94a3b8; }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Top Breadcrumbs & Galaxy Reset -->
  <div class="top-bar">
    <button class="top-btn active" onclick="resetToGalacticView()">🌌 Universal Galaxy</button>
    <span class="top-sep" id="sep-1" style="display:none;">›</span>
    <button class="top-btn" id="nav-lang" style="display:none;" onclick="zoomToCurrentCluster()">🪐 Cluster</button>
    <span class="top-sep" id="sep-2" style="display:none;">›</span>
    <button class="top-btn" id="nav-version" style="display:none;">✦ Star Note</button>
  </div>

  <!-- Left Sidebar Controls -->
  <div class="hud-overlay">
    <h1>🌌 MAZZAROTH</h1>
    <div class="subtitle">AI Second Brain & Celestial Memory Matrix</div>

    <div class="stats-bar">
      <span class="stat-pill" id="stat-stars">✨ 0 Stars</span>
      <span class="stat-pill" id="stat-langs">🪐 60 Clusters</span>
      <span class="stat-pill" id="stat-links">🔗 0 Constellations</span>
    </div>

    <input type="text" id="search-query" placeholder="🔍 Search memory stars, concepts, scriptures..." onkeydown="if(event.key==='Enter') searchGalaxy()">
    <div class="btn-row">
      <button class="action-btn" onclick="searchGalaxy()">🔍 Warp to Star</button>
      <button class="action-btn secondary" onclick="toggleAutoRotate()">⟳ Orbit</button>
      <button class="action-btn secondary" onclick="resetToGalacticView()">🌌 Reset</button>
    </div>

    <div style="font-size: 0.72rem; text-transform: uppercase; color: #94a3b8; font-weight: 800; letter-spacing: 0.5px; margin-top: 4px;">
      🪐 Knowledge Clusters & Focus Areas
    </div>
    <div class="cluster-scroll" id="cluster-list"></div>

    <div style="margin-top: 10px; border-top: 1px solid rgba(168, 85, 247, 0.2); padding-top: 10px;">
      <input type="text" id="new-concept-label" placeholder="Ignite new thought / memory star...">
      <button class="action-btn" style="width:100%;" onclick="formNewMemory()">✨ Ignite Memory Star</button>
    </div>
  </div>

  <!-- Right Memory Note & Knowledge Inspector -->
  <div class="note-inspector" id="note-inspector">
    <div class="note-header">
      <span class="badge badge-lang" id="inspector-badge">SEMANTIC STAR</span>
      <button onclick="closeInspector()" style="background:none; border:none; color:#94a3b8; font-size:1.3rem; cursor:pointer;">✕</button>
    </div>
    <div class="note-title" id="inspector-title">Concept Title</div>
    <div class="note-meta" id="inspector-meta">
      <span id="meta-luminosity">🔥 Recency: 1.00</span>
      <span id="meta-retention">Mass: 0.95</span>
    </div>

    <div class="tags-row" id="inspector-tags"></div>

    <div class="note-content" id="inspector-content">Note content loads here...</div>

    <div id="constellations-section">
      <div style="font-size: 0.75rem; text-transform: uppercase; color: #cbd5e1; font-weight: 800; margin-bottom: 6px;">
        🔗 Orbiting Moons & Connected Constellations
      </div>
      <div class="constellation-grid" id="constellation-grid"></div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let galaxyGroup;
    let starPoints, spiralDustPoints, constellationLines;
    let galaxyData = { bodies: [], lines: [] };
    let currentFocusNode = null;
    let lastRenderedCount = -1;
    let lastRenderedLines = -1;
    let lastRenderedTimestamp = 0;

    const container = document.getElementById('canvas-container');

    function init() {
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x04010a, 0.00025);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 25000);
      camera.position.set(0, 500, 1100);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.3;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 20;
      controls.maxDistance = 6000;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.25;

      // Lights
      scene.add(new THREE.AmbientLight(0x2e1065, 2.2));
      const coreLight = new THREE.PointLight(0xfef08a, 4.5, 4000);
      coreLight.position.set(0, 0, 0);
      scene.add(coreLight);

      // Create unified rotating galaxy group
      galaxyGroup = new THREE.Group();
      scene.add(galaxyGroup);

      // Create Swirling 30,000 Particle Cosmic Spiral Arms
      createCosmicSpiralDust();

      // Click / Raycast
      const raycaster = new THREE.Raycaster();
      raycaster.params.Points.threshold = 8;
      const mouse = new THREE.Vector2();

      window.addEventListener('click', (e) => {
        if (e.target.closest('.hud-overlay') || e.target.closest('.note-inspector') || e.target.closest('.top-bar')) return;
        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        if (starPoints) {
          const intersects = raycaster.intersectObject(starPoints);
          if (intersects.length > 0) {
            const idx = intersects[0].index;
            const body = galaxyData.bodies[idx];
            if (body) onSelectStar(body);
          }
        }
      });

      // Fetch Live Memory Data once on init, then poll softly without tearing down meshes
      fetchGalaxy();
      setInterval(fetchGalaxy, 10000);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // Creates the 30,000 Particle Purple/Gold Spiral Dust
    function createCosmicSpiralDust() {
      const count = 30000;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);

      const numArms = 4;
      const coreColor = new THREE.Color(0xfef08a); // Gold center
      const midColor = new THREE.Color(0xc084fc);  // Purple mid
      const rimColor = new THREE.Color(0x38bdf8);  // Cyan rim

      for (let i = 0; i < count; i++) {
        const i3 = i * 3;
        const arm = i % numArms;
        const armAngle = (arm / numArms) * Math.PI * 2;
        const r = Math.pow(Math.random(), 1.5) * 1100 + 20;
        const spin = r * 0.003;

        const rx = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.28) * r;
        const ry = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.12) * r;
        const rz = (Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.28) * r;

        pos[i3] = Math.cos(armAngle + spin) * r + rx;
        pos[i3 + 1] = ry + Math.sin(r * 0.01) * 20;
        pos[i3 + 2] = Math.sin(armAngle + spin) * r + rz;

        let c;
        if (r < 300) c = coreColor.clone().lerp(midColor, r / 300);
        else c = midColor.clone().lerp(rimColor, (r - 300) / 800);

        col[i3] = c.r;
        col[i3 + 1] = c.g;
        col[i3 + 2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

      const mat = new THREE.PointsMaterial({
        size: 3.0,
        vertexColors: true,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      spiralDustPoints = new THREE.Points(geo, mat);
      galaxyGroup.add(spiralDustPoints);
    }

    async function fetchGalaxy() {
      try {
        const res = await fetch('/api/memory/celestial');
        if (!res.ok) return;
        galaxyData = await res.json();
        const bodiesChanged = galaxyData.bodies.length !== lastRenderedCount;
        const linesChanged = (galaxyData.lines ? galaxyData.lines.length : 0) !== lastRenderedLines;
        if (bodiesChanged || linesChanged) {
          lastRenderedCount = galaxyData.bodies.length;
          lastRenderedLines = galaxyData.lines ? galaxyData.lines.length : 0;
          lastRenderedTimestamp = galaxyData.timestamp || 0;
          renderDatabaseStars(galaxyData);
          populateClusterSidebar(galaxyData);
        } else if (galaxyData.timestamp && galaxyData.timestamp !== lastRenderedTimestamp) {
          lastRenderedTimestamp = galaxyData.timestamp;
          updateStarLuminosities(galaxyData);
        }
      } catch (e) {}
    }

    function dustPalette(r) {
      const coreC = new THREE.Color(0xfef08a);
      const midC = new THREE.Color(0xc084fc);
      const rimC = new THREE.Color(0x38bdf8);
      if (r < 300) return coreC.clone().lerp(midC, r / 300);
      return midC.clone().lerp(rimC, Math.min(1.0, (r - 300) / 600));
    }

    function mix(c1, c2, factor) {
      return {
        r: c1.r * (1 - factor) + c2.r * factor,
        g: c1.g * (1 - factor) + c2.g * factor,
        b: c1.b * (1 - factor) + c2.b * factor,
      };
    }

    function getStarColor(b) {
      const r = Math.sqrt(b.x * b.x + b.z * b.z);
      const falloff = Math.max(0.0, 1.0 - (r / 900.0));
      const radiusFade = 0.35 + 0.65 * falloff;
      const lum = (b.luminosity || 0.85) * radiusFade;

      let tierCol;
      if (b.id.includes(':core:')) {
        tierCol = { r: 1.0, g: 0.95, b: 0.5 };
      } else if (b.id.includes(':lang:')) {
        tierCol = { r: 0.98, g: 0.85, b: 0.2 };
      } else if (b.id.includes(':version:')) {
        tierCol = { r: 0.22, g: 0.75, b: 0.98 };
      } else {
        tierCol = { r: 0.75, g: 0.52, b: 0.98 };
      }

      const dp = dustPalette(r);
      const blended = mix(tierCol, dp, 0.45);
      return {
        r: blended.r * lum,
        g: blended.g * lum,
        b: blended.b * lum,
      };
    }

    function updateStarLuminosities(data) {
      if (!starPoints || !starPoints.geometry) return;
      const colAttr = starPoints.geometry.getAttribute('color');
      if (!colAttr) return;
      const count = data.bodies.length;
      for (let i = 0; i < count; i++) {
        const c = getStarColor(data.bodies[i]);
        colAttr.setXYZ(i, c.r, c.g, c.b);
      }
      colAttr.needsUpdate = true;
    }

    // Renders database stars with recency glow
    function renderDatabaseStars(data) {
      document.getElementById('stat-stars').textContent = `✨ ${data.bodies.length} Stars`;
      document.getElementById('stat-links').textContent = `🔗 ${data.lines.length} Links`;

      if (starPoints) galaxyGroup.remove(starPoints);
      if (constellationLines) galaxyGroup.remove(constellationLines);

      const count = data.bodies.length;
      const geo = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        const b = data.bodies[i];
        pos[i * 3] = b.x;
        pos[i * 3 + 1] = b.y;
        pos[i * 3 + 2] = b.z;

        const c = getStarColor(b);
        col[i * 3] = c.r;
        col[i * 3 + 1] = c.g;
        col[i * 3 + 2] = c.b;
      }

      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));

      const mat = new THREE.PointsMaterial({
        size: 4.0,
        vertexColors: true,
        transparent: true,
        opacity: 0.65,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      starPoints = new THREE.Points(geo, mat);
      galaxyGroup.add(starPoints);

      // Render Constellation Link Filaments with typed alpha & length fade
      const linePos = [];
      const lineCol = [];
      const bodyMap = new Map();
      data.bodies.forEach(b => bodyMap.set(b.id, b));

      data.lines.forEach(l => {
        const s = bodyMap.get(l.source_id);
        const t = bodyMap.get(l.target_id);
        if (s && t) {
          linePos.push(s.x, s.y, s.z);
          linePos.push(t.x, t.y, t.z);

          const dist = Math.sqrt((s.x - t.x)**2 + (s.y - t.y)**2 + (s.z - t.z)**2);
          let spoke_op = 0.25;
          let r = 0.65, g = 0.35, b = 0.98;

          if (l.relationship === 'core_gravitational_ray') {
            spoke_op = 0.08;
            r = 0.98; g = 0.85; b = 0.3;
          } else if (l.relationship === 'interstellar_bridge') {
            const lengthFade = Math.max(0.2, 1.0 - (dist / 200.0));
            spoke_op = 0.12 * lengthFade;
            r = 0.75; g = 0.45; b = 0.95;
          } else if (l.relationship === 'version_orbit') {
            spoke_op = 0.30;
            r = 0.22; g = 0.75; b = 0.98;
          } else if (l.relationship === 'contains_chapter') {
            spoke_op = 0.25;
            r = 0.60; g = 0.40; b = 0.95;
          }

          lineCol.push(r * spoke_op, g * spoke_op, b * spoke_op);
          lineCol.push(r * spoke_op, g * spoke_op, b * spoke_op);
        }
      });

      if (linePos.length > 0) {
        const lineGeo = new THREE.BufferGeometry();
        lineGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePos, 3));
        lineGeo.setAttribute('color', new THREE.Float32BufferAttribute(lineCol, 3));
        const lineMat = new THREE.LineBasicMaterial({
          vertexColors: true,
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        constellationLines = new THREE.LineSegments(lineGeo, lineMat);
        galaxyGroup.add(constellationLines);
      }
    }

    function populateClusterSidebar(data) {
      const list = document.getElementById('cluster-list');
      const clusters = data.bodies.filter(b => b.id.includes(':lang:'));
      document.getElementById('stat-langs').textContent = `🪐 ${clusters.length} Clusters`;

      list.innerHTML = '';
      clusters.forEach(c => {
        const item = document.createElement('div');
        item.className = 'cluster-item';
        item.innerHTML = `<span>✦ ${c.label}</span><span style="color:#94a3b8; font-size:0.7rem;">ORBIT →</span>`;
        item.onclick = () => onSelectStar(c);
        list.appendChild(item);
      });
    }

    // Warp & Inspect Selected Memory Star
    async function onSelectStar(body) {
      currentFocusNode = body;
      const isCluster = body.id.includes(':lang:');

      // Update Top Breadcrumbs
      if (isCluster) {
        currentClusterNode = body;
        document.getElementById('sep-1').style.display = 'inline';
        document.getElementById('nav-lang').style.display = 'inline';
        document.getElementById('nav-lang').textContent = `🪐 ${body.label}`;
        document.getElementById('sep-2').style.display = 'none';
        document.getElementById('nav-version').style.display = 'none';
      } else {
        document.getElementById('sep-2').style.display = 'inline';
        document.getElementById('nav-version').style.display = 'inline';
        document.getElementById('nav-version').textContent = `✦ ${body.label}`;
      }

      // Transform local coordinates into world coordinates
      const worldPos = new THREE.Vector3(body.x, body.y, body.z);
      galaxyGroup.localToWorld(worldPos);

      flyCameraTo(worldPos.x, worldPos.y, worldPos.z, isCluster ? 140 : 80);

      // Open Note Inspector HUD
      showInspector(body);
    }

    async function showInspector(body) {
      const inspector = document.getElementById('note-inspector');
      const badge = document.getElementById('inspector-badge');
      const title = document.getElementById('inspector-title');
      const content = document.getElementById('inspector-content');
      const tagsRow = document.getElementById('inspector-tags');
      const grid = document.getElementById('constellation-grid');

      if (body.id.includes(':core:')) {
        badge.textContent = 'SUPERMASSIVE CORE';
        badge.className = 'badge badge-core';
      } else if (body.id.includes(':lang:')) {
        badge.textContent = 'KNOWLEDGE CLUSTER';
        badge.className = 'badge badge-lang';
      } else if (body.id.includes(':version:')) {
        badge.textContent = 'EDITION STAR';
        badge.className = 'badge badge-version';
      } else {
        badge.textContent = 'MEMORY NOTE';
        badge.className = 'badge badge-book';
      }

      title.textContent = body.label;
      document.getElementById('meta-luminosity').textContent = `🔥 Recency: ${(body.luminosity || 0.9).toFixed(2)}`;
      document.getElementById('meta-retention').textContent = `Mass: ${(body.mass || 0.85).toFixed(2)}`;

      content.textContent = body.content || "Cognitive celestial memory star active in second brain matrix.";

      // Tags
      tagsRow.innerHTML = '';
      const tags = body.tags && body.tags.length > 0 ? body.tags : ['memory', 'second-brain'];
      tags.forEach(t => {
        const pill = document.createElement('span');
        pill.className = 'tag-pill';
        pill.textContent = `#${t}`;
        tagsRow.appendChild(pill);
      });

      // Find connected stars
      const connected = galaxyData.bodies.filter(b => {
        return galaxyData.lines.some(l => (l.source_id === body.id && l.target_id === b.id) || (l.target_id === body.id && l.source_id === b.id));
      });

      grid.innerHTML = '';
      if (connected.length > 0) {
        document.getElementById('constellations-section').style.display = 'block';
        connected.slice(0, 8).forEach(m => {
          const card = document.createElement('div');
          card.className = 'constellation-card';
          card.innerHTML = `<div class="constellation-title">✦ ${m.label}</div><div class="constellation-sub">${m.id.split(':')[1]}</div>`;
          card.onclick = () => onSelectStar(m);
          grid.appendChild(card);
        });
      } else {
        document.getElementById('constellations-section').style.display = 'none';
      }

      inspector.style.display = 'block';
    }

    function closeInspector() {
      document.getElementById('note-inspector').style.display = 'none';
    }

    function flyCameraTo(tx, ty, tz, distance) {
      new TWEEN.Tween(controls.target)
        .to({ x: tx, y: ty, z: tz }, 1000)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();

      new TWEEN.Tween(camera.position)
        .to({ x: tx + distance * 0.7, y: ty + distance * 0.5, z: tz + distance }, 1200)
        .easing(TWEEN.Easing.Cubic.Out)
        .start();
    }

    function resetToGalacticView() {
      document.getElementById('sep-1').style.display = 'none';
      document.getElementById('nav-lang').style.display = 'none';
      document.getElementById('sep-2').style.display = 'none';
      document.getElementById('nav-version').style.display = 'none';
      closeInspector();

      flyCameraTo(0, 0, 0, 1100);
    }

    function zoomToCurrentCluster() {
      if (currentClusterNode) onSelectStar(currentClusterNode);
    }

    async function searchGalaxy() {
      const query = document.getElementById('search-query').value.trim();
      if (!query) return;

      const res = await fetch(`/api/memory/recall?q=${encodeURIComponent(query)}&limit=5`);
      if (res.ok) {
        const results = await res.json();
        if (results.length > 0) {
          const first = results[0];
          const foundBody = galaxyData.bodies.find(b => b.id === first.id);
          if (foundBody) onSelectStar(foundBody);
        }
      }
    }

    async function formNewMemory() {
      const label = document.getElementById('new-concept-label').value.trim();
      if (!label) return;

      await fetch('/api/memory/ingest', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          label: label,
          content: `New memory node created in second brain matrix: ${label}`,
          tier: 'semantic',
          tags: ['second-brain', 'agent-context']
        })
      });

      document.getElementById('new-concept-label').value = '';
      lastRenderedCount = -1; // Trigger redraw
      fetchGalaxy();
    }

    function toggleAutoRotate() {
      controls.autoRotate = !controls.autoRotate;
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate(time) {
      requestAnimationFrame(animate);
      TWEEN.update();

      // Gentle, smooth, low-CPU orbital rotation
      if (galaxyGroup && controls.autoRotate) {
        galaxyGroup.rotation.y += 0.0004;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    window.onload = init;
  </script>
</body>
</html>
